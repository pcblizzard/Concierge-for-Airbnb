name: concierge_airbnb
description: Mehrsprachiger Wand-Tablet-Concierge für eine Airbnb-Wohnung in München.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  qr_flutter: ^4.1.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  camera: ^0.11.0
  screen_brightness: ^1.0.0
  wakelock_plus: ^1.2.0
  flutter_gemma: ^0.11.0
  permission_handler: ^11.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/wohnung.json
